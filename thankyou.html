  <meta charset="UTF-8">
  <title>Thank You</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="font-family: Arial, sans-serif; text-align:center; padding:40px;">

  <h2>Thank you for contacting GlobifyTrade!</h2>
  <p>We have received your enquiry. Our team will get back to you shortly.</p>
  <p>Redirecting you to WhatsApp...</p>

 <script>
const params = new URLSearchParams(window.location.search);
const formType = params.get("form_type");

const whatsappNumber = "919270840556";
let text = "";

if (formType === "contact") {
  // CONTACT FORM DATA
  const name = params.get("name") || "";
  const email = params.get("email") || "";
  const phone = params.get("phone") || "";
  const message = params.get("message") || "";

  text =
    "📩 New Contact Enquiry – GlobifyTrade\n\n" +
    "👤 Name: " + name + "\n" +
    "📧 Email: " + email + "\n" +
    "📞 Phone: " + phone + "\n\n" +
    "📝 Message:\n" + message;

} else {
  // PRODUCT ENQUIRY DATA
  text =
    "📦 New Product Enquiry – GlobifyTrade\n\n" +
    "👤 Name: " + (params.get("name") || "") + "\n" +
    "🏢 Company: " + (params.get("company") || "") + "\n" +
    "📧 Email: " + (params.get("email") || "") + "\n" +
    "📞 Phone: " + (params.get("phone") || "") + "\n\n" +
    "📦 Product: " + (params.get("product") || "") + "\n" +
    "📂 Category: " + (params.get("category") || "") + "\n" +
    "🚢 Container: " + (params.get("container") || "") + "\n" +
    "📑 Order Type: " + (params.get("order_type") || "") + "\n\n" +
    "🌍 Incoterms: " + (params.get("incoterms") || "") + "\n" +
    "📍 Destination: " + (params.get("destination") || "") + "\n" +
    "⏳ Delivery: " + (params.get("delivery") || "") + "\n\n" +
    "💰 Target Price: " + (params.get("price") || "") + "\n" +
    "📦 Packaging: " + (params.get("packaging") || "") + "\n" +
    "💳 Payment: " + (params.get("payment") || "");
}

setTimeout(() => {
  window.location.href =
    "https://wa.me/" + whatsappNumber + "?text=" + encodeURIComponent(text);
}, 2000);
 </script>

</body>
